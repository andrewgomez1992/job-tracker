<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trail — Job Tracker</title>
    <meta name="description" content="A calm place to track every job application, interview and follow-up." />

    <!-- Link previews (LinkedIn, Slack, iMessage, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trail" />
    <meta property="og:url" content="https://job-tracker-two-bay.vercel.app/" />
    <meta property="og:title" content="Trail — Job Tracker" />
    <meta property="og:description" content="A full-stack job search command center. The live demo runs the real Express 5 / SQLite backend in your browser via WebAssembly — no server." />
    <meta property="og:image" content="https://job-tracker-two-bay.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trail — the live demo runs the real backend in your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trail — Job Tracker" />
    <meta name="twitter:description" content="The live demo runs the real Express 5 / SQLite backend in your browser via WebAssembly." />
    <meta name="twitter:image" content="https://job-tracker-two-bay.vercel.app/og.png" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trail" />

    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (() => {
        try {
          const stored = localStorage.getItem('trail.theme');
          const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

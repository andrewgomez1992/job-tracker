<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trail — Job Tracker</title>
    <meta name="description" content="A calm place to track every job application, interview and follow-up." />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trail" />

    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      (() => {
        try {
          const stored = localStorage.getItem('trail.theme');
          const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
